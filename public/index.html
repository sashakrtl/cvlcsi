<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="Le Conseil de la vie lycéenne de la Cité scolaire internationale de Lyon : actualités, projets et idées.">
  <title>CVL · Cité scolaire internationale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#4e91db;--blue-dark:#246bb7;--ink:#17243a;--muted:#6c7788;--line:#e6ebf1;--paper:#f7f9fc;--white:#fff;--pale:#eaf3fd;--shadow:0 18px 55px #1b345010;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:1180px;margin:auto;padding:0 30px}
    header{position:sticky;top:0;z-index:5;background:#f7f9fcdf;backdrop-filter:blur(18px);border-bottom:1px solid #e6ebf180}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.brand img{width:54px;height:54px;object-fit:cover;border-radius:50%;mix-blend-mode:multiply}.brand strong{font-size:14px;letter-spacing:.01em}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.nav{display:flex;align-items:center;gap:5px}.nav button{border:0;background:transparent;color:#596579;padding:10px 12px;border-radius:12px;font-size:13px}.nav button:hover,.nav button.active{background:#eaf2fc;color:var(--blue-dark)}.nav .login-link{margin-left:8px;color:var(--blue-dark);font-weight:700}.menu-toggle{display:none;border:0;background:#eaf2fc;border-radius:12px;width:42px;height:42px;color:var(--ink);font-size:20px}
    main{min-height:76vh}.hero{padding:82px 0 54px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--blue-dark)}.eyebrow:before{content:"";height:1px;width:22px;background:var(--blue)}h1,h2,h3,p{margin-top:0}h1,h2,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:500;letter-spacing:-.035em}h1{font-size:clamp(46px,6vw,74px);line-height:1.04;margin:20px 0}.hero p{font-size:17px;line-height:1.75;color:var(--muted);max-width:520px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:13px;transition:.2s}.btn-primary{background:var(--blue-dark);color:#fff;box-shadow:0 7px 18px #246bb72a}.btn-primary:hover{transform:translateY(-2px);background:#1c5eaa}.btn-soft{background:#eaf2fc;color:var(--blue-dark)}.hero-buttons{display:flex;gap:10px;margin-top:26px}.hero-art{position:relative;min-height:330px;display:grid;place-items:center}.hero-glow{position:absolute;width:315px;height:315px;background:radial-gradient(circle,#dcecff 0,#e9f2fc 52%,transparent 70%);border-radius:50%}.hero-art img{position:relative;width:min(290px,80%);mix-blend-mode:multiply;border-radius:50%;box-shadow:0 18px 55px #246bb714}.art-caption{position:absolute;right:0;bottom:25px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 16px;box-shadow:var(--shadow);font-size:12px;color:var(--muted)}.art-caption b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
    .section{padding:50px 0 76px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.section-head h2{font-size:38px;margin:8px 0 0}.section-head p{color:var(--muted);font-size:14px;margin:7px 0 0}.news-grid{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 4px 18px #263a5605}.news-card{min-height:215px;display:flex;flex-direction:column;justify-content:space-between}.news-card:first-child{background:linear-gradient(140deg,#eaf3fd,#fff 75%);border-color:#dce9f7}.tag{display:inline-flex;width:max-content;align-items:center;background:#edf4fc;color:var(--blue-dark);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.news-card h3{font:500 23px/1.25 "Playfair Display",Georgia,serif;margin:18px 0 10px}.news-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.date{font-size:11px;color:#8993a2;margin-top:20px}.page-title{padding:58px 0 28px}.page-title h1{font-size:52px;margin:12px 0}.page-title p{color:var(--muted);line-height:1.7;max-width:640px}.list{display:grid;gap:13px}.row-card{display:flex;align-items:center;gap:18px}.doc-icon{width:52px;height:52px;border-radius:16px;background:#eaf3fd;display:grid;place-items:center;color:var(--blue-dark);font-size:20px;flex:none}.row-card h3{font-size:15px;margin:0 0 5px}.row-card p{margin:0;color:var(--muted);font-size:12px}.row-card .row-action{margin-left:auto;white-space:nowrap}.project-grid,.member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.project-card h3{font:500 23px "Playfair Display",Georgia,serif;margin:18px 0 9px}.project-card p{color:var(--muted);font-size:13px;line-height:1.65}.project-meta{color:var(--blue-dark);font-size:11px;font-weight:700;margin-top:20px}.member-card{text-align:center;padding:28px 22px}.avatar{height:68px;width:68px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;background:linear-gradient(145deg,#e0efff,#f5f9ff);color:var(--blue-dark);font:500 23px "Playfair Display",Georgia,serif}.member-card h3{font-size:15px;margin:0 0 4px}.member-card p{font-size:12px;color:var(--muted);margin:0 0 16px}.member-card a{font-size:12px;color:var(--blue-dark);font-weight:700}.contact-strip{background:#eaf3fd;border-radius:var(--radius);padding:26px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px}.contact-strip h3{font:500 24px "Playfair Display",Georgia,serif;margin:0 0 6px}.contact-strip p{font-size:13px;color:var(--muted);margin:0}.form-card{max-width:680px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:700;color:#4f5c70}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5ed;border-radius:12px;background:#fff;padding:12px 13px;outline:none;color:var(--ink);font-size:13px}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4e91db20}.hint{font-size:11px;color:var(--muted);line-height:1.5}.notice{padding:14px 16px;border-radius:14px;background:#edf6f0;color:#286946;font-size:13px;margin:16px 0}.empty{padding:36px;text-align:center;color:var(--muted);background:white;border:1px dashed #d9e1ec;border-radius:20px}.empty b{display:block;color:var(--ink);margin-bottom:6px}
    .admin-wrap{padding:46px 0 80px}.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:24px}.admin-side{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;height:max-content}.admin-side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:11px;color:#657085;font-size:13px}.admin-side button.active,.admin-side button:hover{background:#eaf2fc;color:var(--blue-dark)}.admin-panel{min-width:0}.admin-panel h2{font-size:32px;margin:0 0 8px}.admin-panel>p{color:var(--muted);font-size:13px;margin-bottom:23px}.admin-list{display:grid;gap:10px;margin-top:18px}.admin-item{display:flex;gap:9px;align-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}.admin-item strong{font-size:13px}.admin-item small{display:block;color:var(--muted);margin-top:4px}.admin-item button{border:0;background:#fff0f0;color:#a03e3e;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:700}.admin-item button.edit{margin-left:auto;background:#edf4fc;color:var(--blue-dark)}.login-box{max-width:430px;margin:60px auto 90px}.login-box h1{font-size:42px}.login-box .card{padding:30px}.private-badge{display:inline-flex;gap:6px;align-items:center;color:#28714b;font-size:11px;font-weight:700}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:11px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);background:#17243a;color:#fff;padding:13px 18px;border-radius:13px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){.nav{display:none;position:absolute;top:70px;left:20px;right:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:12px;border-radius:18px;flex-direction:column;align-items:stretch}.nav.open{display:flex}.nav button{text-align:left}.menu-toggle{display:block}.hero{grid-template-columns:1fr;gap:0;padding-top:55px}.hero-art{min-height:270px}.hero-glow{width:260px;height:260px}.hero-art img{width:230px}.art-caption{right:8%;bottom:2px}.news-grid{grid-template-columns:1fr 1fr}.news-card:first-child{grid-column:span 2}.project-grid,.member-grid{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:1fr}.admin-side{display:flex;overflow:auto;gap:4px}.admin-side button{min-width:max-content;width:auto}}
    @media(max-width:560px){.shell{padding:0 19px}.brand img{height:46px;width:46px}.brand strong{font-size:12px}.hero{padding-top:40px}h1{font-size:48px}.hero p{font-size:15px}.hero-art{min-height:230px}.hero-glow{width:220px;height:220px}.hero-art img{width:190px}.art-caption{font-size:10px}.section{padding:34px 0 54px}.section-head{align-items:start;flex-direction:column}.section-head h2{font-size:32px}.news-grid,.project-grid,.member-grid{grid-template-columns:1fr}.news-card:first-child{grid-column:auto}.news-card{min-height:180px}.page-title{padding:38px 0 20px}.page-title h1{font-size:42px}.form-grid{grid-template-columns:1fr;gap:0}.row-card{align-items:flex-start}.row-card .row-action{font-size:11px;padding:10px}.contact-strip{align-items:flex-start;flex-direction:column}.footer-inner{flex-direction:column}.admin-wrap{padding-top:30px}}
    .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 50px}.contact-card{display:flex;align-items:center;gap:14px;min-height:92px}.contact-card small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.contact-card strong{font-size:13px;overflow-wrap:anywhere}.member-role{display:block!important;color:var(--blue-dark)!important;font-size:11px!important;font-weight:700;margin:2px 0 6px!important}
    @media(max-width:850px){.contact-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.contact-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="shell topbar">
  <a class="brand" href="#accueil" aria-label="Accueil CVL"><img src="logo-cvl.jpg" alt="Logo CVL CSI"><span><strong>Conseil de la vie lycéenne</strong><small>Cité scolaire internationale · Lyon</small></span></a>
  <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
  <nav class="nav" id="nav" aria-label="Navigation principale">
    <button data-page="accueil">Accueil</button><button data-page="reunions">Comptes rendus</button><button data-page="projets">Projets</button><button data-page="idees">Proposer une idée</button><button data-page="apropos">À propos</button><button class="login-link" data-page="connexion">Se connecter&nbsp; ↗</button>
  </nav>
</div></header>
<main id="app"></main>
<footer><div class="shell footer-inner"><span>© <span id="year"></span> CVL · Cité scolaire internationale de Lyon</span><span>Un lycée qui se construit ensemble.</span></div></footer>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const API = '/.netlify/functions/cvl';
  const KEY = 'cvl-csi-content-v1';
  const seed = {
    news:[{id:'n1',title:'Bienvenue sur le site du CVL',text:'Retrouvez ici les nouvelles du Conseil de la vie lycéenne, les projets qui prennent vie et les prochains rendez-vous.',date:new Date().toISOString().slice(0,10),label:'La vie du CVL'}],
    meetings:[],
    projects:[{id:'p1',title:'Les projets de cette année',text:'Les idées et projets du CVL seront présentés ici au fil de leur avancement. Vous avez une envie pour le lycée ? Partagez-la avec nous.',status:'En préparation'}],
    members:[], contacts:[{id:'contact-email',category:'E-mail général',value:'À renseigner',url:''},{id:'contact-instagram',category:'Instagram',value:'À renseigner',url:''}], messages:[]
  };
  const serverMode=location.protocol==='https:'||location.hostname==='localhost';
  let data; try{data={...structuredClone(seed),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(seed)}
  if(!Array.isArray(data.contacts))data.contacts=[];
  let page='accueil',adminTab='actualites',logged=false,editing=null;
  const app=document.getElementById('app');
  async function apiFetch(method='GET',payload=null,query=''){const response=await fetch(API+query,{method,credentials:'same-origin',headers:payload instanceof File?{}:{'Content-Type':'application/json'},body:payload==null?undefined:payload instanceof File?payload:JSON.stringify(payload)});if(!response.ok)throw new Error((await response.text())||`Erreur ${response.status}`);const type=response.headers.get('content-type')||'';return type.includes('application/json')?response.json():response;}
  async function save(){if(serverMode){await apiFetch('POST',{action:'save',content:data});return}localStorage.setItem(KEY,JSON.stringify(data))}
  async function persistOrReload(){try{await save();return true}catch(err){toast('Enregistrement impossible. Réessaie dans un instant.');if(serverMode){try{const result=await apiFetch('GET');if(result.content)data={...structuredClone(seed),...result.content};logged=!!result.authenticated}catch{}}return false}}
  async function initialize(){if(serverMode){try{const result=await apiFetch('GET');if(result.content)data={...structuredClone(seed),...result.content};logged=!!result.authenticated}catch{toast('Le stockage en ligne n’est pas encore configuré.')}}render()}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateFmt=s=>{if(!s)return '';let d=new Date(s+'T12:00:00');return isNaN(d)?'':new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(d)};
  const initials=s=>String(s||'CVL').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
  const empty=(title,desc)=>`<div class="empty"><b>${title}</b>${desc}</div>`;
  function render(){
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    if(page==='accueil')home(); else if(page==='reunions')meetings(); else if(page==='projets')projects(); else if(page==='idees')ideas(); else if(page==='apropos')about(); else if(page==='connexion')login(); else if(page==='admin')dashboard();
  }
  function home(){const cards=data.news.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));app.innerHTML=`<div class="shell"><section class="hero"><div><span class="eyebrow">La voix des élèves</span><h1>Faisons vivre<br>notre lycée.</h1><p>Le Conseil de la vie lycéenne imagine, propose et fait avancer des projets pour rendre la vie au lycée plus belle, ensemble.</p><div class="hero-buttons"><button class="btn btn-primary" data-go="idees">Partager une idée <span>↗</span></button><button class="btn btn-soft" data-go="projets">Découvrir nos projets</button></div></div><div class="hero-art"><div class="hero-glow"></div><img src="logo-cvl.jpg" alt="Logo CVL de la Cité scolaire internationale"></div></section>
      <section class="section"><div class="section-head"><div><span class="eyebrow">En ce moment</span><h2>Les actualités</h2><p>La vie du CVL, en quelques nouvelles.</p></div><button class="btn btn-soft" data-go="projets">Voir les projets&nbsp; →</button></div><div class="news-grid">${cards.length?cards.map((n,i)=>`<article class="card news-card"><div><span class="tag">${esc(n.label||'Actualité')}</span><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div><div class="date">${dateFmt(n.date)}</div></article>`).join(''):empty('Pas encore d’actualité','Les nouvelles du CVL apparaîtront ici.')}</div></section></div>`;}
  function meetings(){app.innerHTML=`<div class="shell"><section class="page-title"><span class="eyebrow">Transparence & dialogue</span><h1>Comptes rendus</h1><p>Les sujets abordés et les décisions prises pendant les réunions du CVL.</p></section><section class="section" style="padding-top:0"><div class="list">${data.meetings.length?data.meetings.slice().reverse().map(m=>`<article class="card row-card"><div class="doc-icon">↧</div><div><h3>${esc(m.title)}</h3><p>${dateFmt(m.date)}${m.fileName?' · '+esc(m.fileName):''}</p></div>${m.fileName?`<button class="btn btn-soft row-action" data-pdf="${esc(m.id)}">Consulter le PDF&nbsp; ↗</button>`:`<span class="hint row-action">Document à venir</span>`}</article>`).join(''):empty('Aucun compte rendu publié','Les prochains comptes rendus seront ajoutés ici.')}</div></section></div>`;}
  function projects(){app.innerHTML=`<div class="shell"><section class="page-title"><span class="eyebrow">De l’idée à l’action</span><h1>Projets en cours</h1><p>Les initiatives portées par le CVL pour améliorer le quotidien et faire vivre la communauté du lycée.</p></section><section class="section" style="padding-top:0"><div class="project-grid">${data.projects.length?data.projects.map(p=>`<article class="card project-card"><span class="tag">${esc(p.status||'En cours')}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><div class="project-meta">Cité scolaire internationale · Lyon</div></article>`).join(''):empty('De beaux projets arrivent','Cette page se remplira bientôt.')}</div><div class="contact-strip"><div><h3>Une idée pour le lycée ?</h3><p>Chaque projet commence par une conversation.</p></div><button class="btn btn-primary" data-go="idees">Nous écrire&nbsp; ↗</button></div></section></div>`;}
  function ideas(){app.innerHTML=`<div class="shell"><section class="page-title"><span class="eyebrow">Espace d’expression</span><h1>Une idée en tête&nbsp;?</h1><p>Un événement, un aménagement, une action solidaire… Racontez-nous. Votre message est transmis au CVL et n’est pas publié sur le site.</p></section><section class="section" style="padding-top:0"><form class="card form-card" id="ideaForm"><div class="private-badge">● &nbsp;Message privé, visible par le CVL uniquement</div><div class="form-grid" style="margin-top:20px"><div class="field"><label for="sender">Votre prénom (facultatif)</label><input id="sender" name="sender" maxlength="80" placeholder="Comment vous appeler ?"></div><div class="field"><label for="email">Votre e-mail (facultatif)</label><input id="email" name="email" type="email" maxlength="160" placeholder="pour vous répondre"></div></div><div class="field"><label for="subject">Le sujet de votre idée</label><input id="subject" name="subject" required maxlength="120" placeholder="Ex. Un espace de détente dans la cour"></div><div class="field"><label for="message">Décrivez votre proposition</label><textarea id="message" name="message" required maxlength="3000" placeholder="Qu’aimeriez-vous voir changer ou se créer ?"></textarea></div><button class="btn btn-primary">Envoyer au CVL&nbsp; ↗</button><p class="hint" style="margin:14px 0 0">Votre proposition sera enregistrée en ligne et visible uniquement dans l’espace CVL.</p></form></section></div>`;}
  function contactHref(c){const value=String(c.value||'').trim();if(value.toLowerCase()==='à renseigner')return '';if(c.url?.trim()&&/^https?:\/\//i.test(c.url.trim()))return c.url.trim();if((c.category||'').toLowerCase().includes('mail')||value.includes('@'))return 'mailto:'+value;if((c.category||'').toLowerCase().includes('instagram'))return 'https://instagram.com/'+value.replace(/^@/,'');if(/^https?:\/\//i.test(value))return value;return '';}
  function about(){app.innerHTML=`<div class="shell"><section class="page-title"><span class="eyebrow">Qui sommes-nous ?</span><h1>À propos du CVL</h1><p>Le Conseil de la vie lycéenne est un lieu d’échange et de proposition. Ses membres font le lien entre les élèves et la communauté éducative.</p></section>${data.contacts.length?`<section class="contact-grid" aria-label="Contacter le CVL">${data.contacts.map(c=>{const href=contactHref(c),tag=href?'a':'div';return `<${tag} class="card contact-card" ${href?`href="${esc(href)}" ${href.startsWith('http')?'target="_blank" rel="noopener noreferrer"':''}`:''}><div class="doc-icon">${(c.category||'').toLowerCase().includes('instagram')?'◎':(c.category||'').toLowerCase().includes('mail')?'✉':'↗'}</div><div><small>${esc(c.category)}</small><strong>${esc(c.value)}</strong></div></${tag}>`}).join('')}</section>`:''}<section class="section" style="padding-top:0"><div class="section-head"><div><span class="eyebrow">Les membres du CVL</span><h2>Vos contacts</h2><p>Découvrez les membres et leurs rôles au sein de la Cité scolaire internationale.</p></div></div><div class="member-grid">${data.members.length?data.members.map(m=>`<article class="card member-card"><div class="avatar">${esc(initials(m.name))}</div><h3>${esc(m.name)}</h3><span class="member-role">${esc(m.role||'CVL')}</span><p>${esc(m.className)}</p>${m.contact?`<a href="${String(m.contact).includes('@')?'mailto:':''}${esc(m.contact)}">${esc(m.contact)}</a>`:''}</article>`).join(''):empty('Les membres se présentent bientôt','Les coordonnées des personnes du CVL seront ajoutées ici.')}</div><div class="contact-strip"><div><h3>Écrire au CVL</h3><p>Une question, un retour ou une envie d’échanger ? Transmettez-nous votre message en toute simplicité.</p></div><button class="btn btn-primary" data-go="idees">Envoyer un message&nbsp; ↗</button></div></section></div>`;}
  function login(){if(logged){page='admin';dashboard();return}app.innerHTML=`<div class="shell"><section class="login-box"><span class="eyebrow">Espace réservé</span><h1>Connexion CVL</h1><div class="card"><p style="font-size:13px;color:var(--muted);line-height:1.6">Connectez-vous pour gérer les actualités, projets, comptes rendus, membres et messages reçus.</p><form id="loginForm"><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••••"></div><button class="btn btn-primary" style="width:100%">Se connecter&nbsp; ↗</button><p class="hint" style="margin:14px 0 0">La connexion sécurisée se vérifie sur le serveur Netlify.</p></form></div></section></div>`;}
  const tabs=[['actualites','Actualités'],['reunions','Comptes rendus'],['projets','Projets'],['messages','Messages reçus'],['membres','Membres'],['contacts','Coordonnées CVL']];
  function dashboard(){if(!logged){page='connexion';login();return}const tab=adminTab;app.innerHTML=`<div class="shell admin-wrap"><div class="section-head"><div><span class="eyebrow">Administration</span><h2 style="font:500 36px 'Playfair Display',Georgia,serif;margin:8px 0 0">Espace du CVL</h2><p>Gérez le contenu visible et les propositions reçues.</p></div><button class="btn btn-soft" id="logout">Se déconnecter</button></div><div class="admin-layout"><aside class="admin-side">${tabs.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}${id==='messages'&&data.messages.length?' · '+data.messages.length:''}</button>`).join('')}</aside><section class="admin-panel">${tab==='actualites'?adminNews():tab==='reunions'?adminMeetings():tab==='projets'?adminProjects():tab==='messages'?adminMessages():tab==='contacts'?adminContacts():adminMembers()}</section></div></div>`;}
  function adminNews(){const item=editing?.startsWith('news:')?data.news.find(x=>x.id===editing.split(':')[1]):null;return `<h2>Actualités</h2><p>Publiez une nouvelle sur la page d’accueil.</p><form id="newsForm" class="card"><div class="field"><label>Titre</label><input name="title" required maxlength="120" value="${esc(item?.title||'')}"></div><div class="field"><label>Catégorie</label><input name="label" maxlength="40" placeholder="La vie du CVL" value="${esc(item?.label||'')}"></div><div class="field"><label>Texte</label><textarea name="text" required maxlength="1200">${esc(item?.text||'')}</textarea></div><button class="btn btn-primary">${item?'Enregistrer les modifications':'Publier l’actualité'}</button>${item?'<button type="button" class="btn btn-soft" data-cancel-edit>Annuler</button>':''}</form><div class="admin-list">${data.news.map(n=>adminItem(n.title,`${dateFmt(n.date)} · ${n.label||'Actualité'}`,`news:${n.id}`)).join('')}</div>`;}
  function adminMeetings(){const item=editing?.startsWith('meetings:')?data.meetings.find(x=>x.id===editing.split(':')[1]):null;return `<h2>Comptes rendus</h2><p>Ajoutez les documents PDF des réunions.</p><form id="meetingForm" class="card"><div class="form-grid"><div class="field"><label>Titre de la réunion</label><input name="title" required maxlength="120" placeholder="Réunion du CVL" value="${esc(item?.title||'')}"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${esc(item?.date||'')}"></div></div><div class="field"><label>Document PDF ${item?'(facultatif si le document ne change pas)':''}</label><input name="pdf" type="file" accept="application/pdf,.pdf" ${item?'':'required'}></div><p class="hint">Le PDF sera stocké en ligne avec le compte rendu.</p><button class="btn btn-primary">${item?'Enregistrer les modifications':'Ajouter le compte rendu'}</button>${item?'<button type="button" class="btn btn-soft" data-cancel-edit>Annuler</button>':''}</form><div class="admin-list">${data.meetings.map(m=>adminItem(m.title,`${dateFmt(m.date)} · ${m.fileName||'PDF'}`,`meetings:${m.id}`)).join('')}</div>`;}
  function adminProjects(){const item=editing?.startsWith('projects:')?data.projects.find(x=>x.id===editing.split(':')[1]):null;return `<h2>Projets</h2><p>Présentez les initiatives et leur état d’avancement.</p><form id="projectForm" class="card"><div class="field"><label>Nom du projet</label><input name="title" required maxlength="100" value="${esc(item?.title||'')}"></div><div class="field"><label>Description</label><textarea name="text" required maxlength="1200">${esc(item?.text||'')}</textarea></div><div class="field"><label>Avancement</label><select name="status">${['En préparation','En cours','À venir','Terminé'].map(s=>`<option ${item?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn btn-primary">${item?'Enregistrer les modifications':'Ajouter le projet'}</button>${item?'<button type="button" class="btn btn-soft" data-cancel-edit>Annuler</button>':''}</form><div class="admin-list">${data.projects.map(p=>adminItem(p.title,p.status||'En cours',`projects:${p.id}`)).join('')}</div>`;}
  function adminMessages(){return `<h2>Messages privés</h2><p>Les idées envoyées par les personnes qui visitent le site sont visibles uniquement ici.</p>${data.messages.length?`<div class="admin-list">${data.messages.slice().reverse().map(m=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="tag">Proposition privée</span><h3 style="margin:12px 0 5px;font-size:16px">${esc(m.subject)}</h3><p class="hint" style="margin:0 0 12px">${esc(m.sender||'Sans nom')}${m.email?' · '+esc(m.email):''} · ${dateFmt(m.date)}</p></div><button class="btn btn-soft" data-delete="messages:${esc(m.id)}">Supprimer</button></div><div style="font-size:13px;line-height:1.65;color:#586579;white-space:pre-wrap">${esc(m.message)}</div></article>`).join('')}</div>`:empty('Aucun message reçu','Les nouvelles propositions s’afficheront ici.')}`;}
  function adminMembers(){const item=editing?.startsWith('members:')?data.members.find(x=>x.id===editing.split(':')[1]):null;const roles=['CVL','Candidat·e CAVL','CA','Vice-président·e','Président·e'];return `<h2>Membres du CVL</h2><p>Ajoutez, modifiez ou retirez les coordonnées affichées dans « À propos ».</p><form id="memberForm" class="card"><div class="form-grid"><div class="field"><label>Nom et prénom</label><input name="name" required maxlength="100" value="${esc(item?.name||'')}"></div><div class="field"><label>Classe</label><input name="className" required maxlength="50" placeholder="Ex. Première" value="${esc(item?.className||'')}"></div></div><div class="form-grid"><div class="field"><label>Rôle</label><select name="role">${roles.map(r=>`<option ${((item?.role||'CVL')===r)?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Contact (e-mail ou autre)</label><input name="contact" maxlength="160" placeholder="Adresse e-mail ou contact public" value="${esc(item?.contact||'')}"></div></div><button class="btn btn-primary">${item?'Enregistrer les modifications':'Ajouter la personne'}</button>${item?'<button type="button" class="btn btn-soft" data-cancel-edit>Annuler</button>':''}</form><div class="admin-list">${data.members.map(m=>adminItem(m.name,`${m.role||'CVL'} · ${m.className}${m.contact?' · '+m.contact:''}`,`members:${m.id}`)).join('')}</div>`;}
  function adminContacts(){const item=editing?.startsWith('contacts:')?data.contacts.find(x=>x.id===editing.split(':')[1]):null;return `<h2>Coordonnées générales</h2><p>Ajoutez ici l’adresse e-mail générale, Instagram et tout autre moyen de contacter le CVL. Chaque entrée peut avoir sa propre catégorie.</p><form id="contactForm" class="card"><div class="form-grid"><div class="field"><label>Catégorie</label><input name="category" required maxlength="50" placeholder="E-mail général, Instagram, autre…" value="${esc(item?.category||'')}"></div><div class="field"><label>Adresse, nom d’utilisateur ou valeur</label><input name="value" required maxlength="180" placeholder="ex. cvl@… ou @cvl…" value="${esc(item?.value||'')}"></div></div><div class="field"><label>Lien (facultatif)</label><input name="url" maxlength="240" placeholder="https://… (e-mail et Instagram sont reconnus automatiquement)" value="${esc(item?.url||'')}"></div><button class="btn btn-primary">${item?'Enregistrer les modifications':'Ajouter une coordonnée'}</button>${item?'<button type="button" class="btn btn-soft" data-cancel-edit>Annuler</button>':''}</form><div class="admin-list">${data.contacts.map(c=>adminItem(c.category,c.value,`contacts:${c.id}`)).join('')}</div>`;}
  function adminItem(title,subtitle,key){return `<div class="admin-item"><div><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div><button class="edit" data-edit="${esc(key)}">Modifier</button><button data-delete="${esc(key)}">Supprimer</button></div>`}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
  async function storePdf(id,file){if(file.size>5*1024*1024)throw new Error('PDF trop volumineux (maximum 5 Mo).');if(serverMode){await apiFetch('PUT',file,`?pdf=${encodeURIComponent(id)}`);return}return new Promise((resolve,reject)=>{const req=indexedDB.open('cvl-csi-pdfs',1);req.onupgradeneeded=()=>req.result.createObjectStore('pdfs');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const tx=req.result.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(file,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)}})}
  function openPdf(id){if(serverMode){window.open(`${API}?pdf=${encodeURIComponent(id)}`,'_blank','noopener');return}const req=indexedDB.open('cvl-csi-pdfs',1);req.onsuccess=()=>{const tx=req.result.transaction('pdfs','readonly');const get=tx.objectStore('pdfs').get(id);get.onsuccess=()=>{if(get.result){const url=URL.createObjectURL(get.result);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}else toast('PDF introuvable dans ce navigateur.')}};req.onerror=()=>toast('Impossible d’ouvrir ce PDF.')}
  async function removeRecord(key){const [collection,id]=key.split(':');if(!data[collection])return;const original=data[collection];data[collection]=original.filter(x=>x.id!==id);if(collection==='meetings'&&serverMode){try{await apiFetch('DELETE',null,`?pdf=${encodeURIComponent(id)}`)}catch{data[collection]=original;toast('Suppression impossible.');return}}if(await persistOrReload())dashboard();else dashboard()}
  document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;editing=null;document.getElementById('nav').classList.remove('open');render();window.scrollTo(0,0);return}const go=e.target.closest('[data-go]');if(go){page=go.dataset.go;render();window.scrollTo(0,0);return}const tab=e.target.closest('[data-tab]');if(tab){adminTab=tab.dataset.tab;editing=null;dashboard();return}const edit=e.target.closest('[data-edit]');if(edit){editing=edit.dataset.edit;const group=editing.split(':')[0];adminTab=group==='news'?'actualites':group;dashboard();document.querySelector('.admin-panel form')?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('[data-cancel-edit]')){editing=null;dashboard();return}const del=e.target.closest('[data-delete]');if(del){if(confirm('Supprimer cet élément ?'))await removeRecord(del.dataset.delete);return}const pdf=e.target.closest('[data-pdf]');if(pdf)openPdf(pdf.dataset.pdf);if(e.target.id==='logout'){try{if(serverMode)await apiFetch('POST',{action:'logout'})}catch{}logged=false;editing=null;page='accueil';render();toast('Déconnexion effectuée.')}});
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('nav').classList.toggle('open'));
  document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='loginForm'){try{if(!serverMode)throw new Error('Le site doit être publié sur Netlify pour activer la connexion.');const result=await apiFetch('POST',{action:'login',password:f.password.value});data={...structuredClone(seed),...result.content};logged=true;adminTab='actualites';page='admin';render();toast('Connexion réussie.')}catch{toast('Connexion impossible : vérifie le mot de passe et la configuration Netlify.')}return}
    if(f.id==='ideaForm'){const message={id:crypto.randomUUID(),subject:fd.get('subject'),message:fd.get('message'),sender:fd.get('sender'),email:fd.get('email'),date:new Date().toISOString().slice(0,10)};try{if(serverMode)await apiFetch('POST',{action:'message',message});else{data.messages.push(message);localStorage.setItem(KEY,JSON.stringify(data))}f.reset();toast('Merci, votre idée a bien été transmise au CVL.')}catch{toast('Envoi impossible pour le moment. Réessaie plus tard.')}return}
    if(f.id==='newsForm'){const record={id:editing?.startsWith('news:')?editing.split(':')[1]:crypto.randomUUID(),title:fd.get('title'),label:fd.get('label')||'Actualité',text:fd.get('text'),date:new Date().toISOString().slice(0,10)};if(editing?.startsWith('news:'))data.news=data.news.map(x=>x.id===record.id?record:x);else data.news.push(record);if(await persistOrReload()){editing=null;dashboard();toast('Actualité enregistrée en ligne.')}return}
    if(f.id==='projectForm'){const record={id:editing?.startsWith('projects:')?editing.split(':')[1]:crypto.randomUUID(),title:fd.get('title'),text:fd.get('text'),status:fd.get('status')};if(editing?.startsWith('projects:'))data.projects=data.projects.map(x=>x.id===record.id?record:x);else data.projects.push(record);if(await persistOrReload()){editing=null;dashboard();toast('Projet enregistré en ligne.')}return}
    if(f.id==='memberForm'){const record={id:editing?.startsWith('members:')?editing.split(':')[1]:crypto.randomUUID(),name:fd.get('name'),className:fd.get('className'),role:fd.get('role'),contact:fd.get('contact')};if(editing?.startsWith('members:'))data.members=data.members.map(x=>x.id===record.id?record:x);else data.members.push(record);if(await persistOrReload()){editing=null;dashboard();toast('Membre enregistré·e en ligne.')}return}
    if(f.id==='contactForm'){const record={id:editing?.startsWith('contacts:')?editing.split(':')[1]:crypto.randomUUID(),category:fd.get('category'),value:fd.get('value'),url:fd.get('url')};if(editing?.startsWith('contacts:'))data.contacts=data.contacts.map(x=>x.id===record.id?record:x);else data.contacts.push(record);if(await persistOrReload()){editing=null;dashboard();toast('Coordonnée enregistrée en ligne.')}return}
    if(f.id==='meetingForm'){const file=fd.get('pdf');if(file?.size&&file.type!=='application/pdf'){toast('Choisissez un fichier PDF.');return}const old=editing?.startsWith('meetings:')?data.meetings.find(x=>x.id===editing.split(':')[1]):null;const id=old?.id||crypto.randomUUID();try{if(file?.size)await storePdf(id,file);const record={id,title:fd.get('title'),date:fd.get('date'),fileName:file?.size?file.name:(old?.fileName||'')};if(old)data.meetings=data.meetings.map(x=>x.id===id?record:x);else data.meetings.push(record);if(await persistOrReload()){editing=null;dashboard();toast('Compte rendu enregistré en ligne.')}}catch(err){toast(err.message.includes('5 Mo')?err.message:'Le compte rendu n’a pas pu être enregistré.')}}
  });
  document.getElementById('year').textContent=new Date().getFullYear();initialize();
})();
</script>
</body>
